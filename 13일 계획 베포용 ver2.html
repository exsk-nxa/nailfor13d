<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네일 실기 13일 완성 플래너 (종합 평가 모듈 포함)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
 :root{
 --bg:#F4F7FA;
 --surface:#FFFFFF;
 --surface-soft:#EDF2F7;
 --ink:#1A202C;
 --ink-soft:#4A5568;
 --line:#CBD5E0;
 --blue:#4A6FA5;
 --blue-soft:#D5E2F0;
 --coral:#E07A5F;
 --coral-soft:#F5DDD6;
 --purple:#6B4C7A;
 --purple-soft:#E3D6E8;
 --lime:#6A994E;
 --lime-soft:#D5E8D9;
 --gold:#D4A373;
 --gold-soft:#F0E4D3;
 --shadow: 0 10px 30px -12px rgba(26,32,44,0.15);
 --radius: 18px;
 }
 *{box-sizing:border-box;}
 body{
 margin:0;
 background: var(--bg);
 color:var(--ink);
 font-family:'Noto Sans KR', sans-serif;
 -webkit-font-smoothing:antialiased;
 padding-bottom:80px;
 }
 h1,h2,h3{font-weight:800;}
 .wrap{max-width:1180px; margin:0 auto; padding:36px 24px 0;}

 header.top{display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end; justify-content:space-between; margin-bottom:28px;}
 .brand-eyebrow{font-size:12px; letter-spacing:0.28em; color:var(--blue); font-weight:700; text-transform:uppercase; margin-bottom:6px;}
 header.top h1{font-size:34px; margin:0 0 4px; font-weight:700; color:var(--ink);}
 header.top p{margin:0; color:var(--ink-soft); font-size:14px;}
 .overall-card{
 background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
 padding:18px 26px; display:flex; align-items:center; gap:20px; min-width:290px;
 }
 .overall-ring{position:relative; width:74px; height:74px; flex:none;}
 .overall-ring svg{transform:rotate(-90deg);}
 .overall-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px;}
 .overall-meta .label{font-size:11px; color:var(--ink-soft); letter-spacing:.08em;}
 .overall-meta .num{font-size:13px; margin-top:2px; color:var(--ink);}

 .subject-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px;}
 .subject-mini{background:var(--surface); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);}
 .subject-mini .top-line{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
 .subject-mini .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px;}
 .subject-mini .name{font-size:12.5px; font-weight:600; color:var(--ink);}
 .subject-mini .pct{font-size:13px; font-weight:800;}
 .bar-track{height:7px; border-radius:10px; background:var(--surface-soft); overflow:hidden;}
 .bar-fill{height:100%; border-radius:10px; transition:width .5s ease;}

 section.calendar, section.checklist-module, section.stats-module {background:var(--surface); border-radius:24px; box-shadow:var(--shadow); padding:26px 26px 22px; margin-bottom:30px;}
 .section-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
 .section-head h2{font-size:19px; margin:0;}
 .section-head .hint{font-size:12px; color:var(--ink-soft);}
 .week-label{font-size:11px; color:var(--ink-soft); letter-spacing:.1em; margin:14px 0 8px; text-transform:uppercase;}
 .cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:10px;}
 .nail-cell{
 position:relative; border:none; cursor:pointer; background:var(--surface-soft);
 border-radius:16px;
 height:96px; overflow:hidden; padding:0;
 box-shadow: inset 0 0 0 2px var(--line);
 transition: box-shadow .2s ease, transform .15s ease;
 }
 .nail-cell:hover{transform:translateY(-2px);}
 .nail-cell.active{box-shadow: inset 0 0 0 2.5px var(--ink);}
 .nail-fill{position:absolute; left:0; right:0; bottom:0; transition:height .5s ease;}
 .nail-cell .label{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; height:100%; padding-top:10px; pointer-events:none;}
 .nail-cell .day-num{font-weight:700; font-size:15px;}
 .nail-cell .day-date{font-size:9.5px; color:var(--ink-soft); margin-top:1px;}
 .nail-cell .day-pct{margin-top:6px; font-size:10.5px; font-weight:700; background:rgba(255,255,255,.75); border-radius:8px; padding:1px 6px;}
 .nail-cell.mock::after{
 content:'모의'; position:absolute; top:5px; right:5px; z-index:3; font-size:8.5px; font-weight:700; line-height:1;
 color:#fff; background:var(--purple); padding:3px 6px; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.2);
 }

 section.day-panel{background:var(--surface); border-radius:24px; box-shadow:var(--shadow); padding:28px 28px 24px; margin-bottom:30px;}
 .day-panel-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:16px;}
 .day-panel-head h2{font-size:24px; margin:0;}
 .day-panel-head .date-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
 .note-chip{display:inline-block; margin-left:8px; font-size:11px; background:var(--blue-soft); color:var(--blue); padding:2px 9px; border-radius:20px; font-weight:600;}
 .today-progress{display:flex; align-items:center; gap:12px;}
 .today-progress .ring-wrap{width:56px; height:56px; position:relative;}
 .today-progress .ring-wrap .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;}
 .today-progress .cap{font-size:11px; color:var(--ink-soft);}

 .task-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:22px;}
 @media (max-width:980px){.task-grid{grid-template-columns:repeat(2,1fr);}}
 @media (max-width: 600px) {.modal-box, .info-modal-box,
 .visual-timer-box { margin: 0 8px; width: calc(100% - 16px); max-width: 100%; padding: 20px 16px; border-radius: 16px; max-height: 90vh; }
 .visual-timer-box { padding: 24px 16px 20px; }
}
 .task-card{border-radius:16px; padding:16px 16px 14px; border:1px solid var(--line); background:linear-gradient(180deg, #fff, #f9fafb);}
 .task-card .subj-tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.04em; color:#fff; padding:3px 9px; border-radius:20px; margin-bottom:10px;}
 .task-card .content-name{font-size:15px; font-weight:700; margin:0 0 2px; line-height:1.3;}
 .task-card .target-line{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
 .reps{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
 .rep-btn{
 width:30px; height:30px; border-radius:9px; border:1.5px solid var(--line); background:#fff;
 cursor:pointer; font-size:12px; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
 transition:all .15s ease;
 }
 .rep-btn.done{color:#fff; border-color:transparent;}
 .task-mini-track{height:5px; border-radius:8px; background:var(--surface-soft); overflow:hidden; margin-bottom:10px;}
 .task-mini-fill{height:100%; border-radius:8px; transition:width .4s ease;}

 .time-log-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11.5px; color: var(--ink-soft); }
 .time-log-row input[type="number"] { width: 60px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; font-weight: 600; text-align: center; }
 .time-log-row .compare { font-weight: 700; margin-left: 4px; }
 .time-log-row .compare.good { color: var(--lime); }
 .time-log-row .compare.bad { color: var(--coral); }

 .timer-row{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; background:var(--surface-soft); border-radius:10px; padding:6px 9px;}
 .timer-row .t-target{font-weight:600;}
 .timer-row .t-elapsed{font-weight:700; color:var(--ink);}
 .timer-row .t-elapsed.over{color:var(--coral);}
 .timer-btns{display:flex; gap:6px;}
 .timer-btns button{border:none; background:var(--ink); color:#fff; font-size:10.5px; border-radius:7px; padding:4px 8px; cursor:pointer;}
 .timer-btns button.secondary{background:var(--line); color:var(--ink);}

 .subfeedback textarea{width:100%; font-size:11.5px; border:1px solid var(--line); border-radius:10px; padding:7px 9px; resize:vertical; min-height:44px; font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:#fff;}
 .subfeedback label{font-size:10.5px; color:var(--ink-soft); display:block; margin-bottom:3px;}

 .mock-analysis { background: var(--purple-soft); border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
 .mock-analysis h4 { margin: 0 0 10px; font-size: 13px; font-weight: 700; color: var(--purple); }
 .mock-analysis .row { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 8px; }
 .mock-analysis .row label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
 .mock-analysis .row input[type="number"], .mock-analysis .row input[type="text"] { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; width: 80px; }
 .mock-analysis .row input[type="text"] { width: 140px; }
 .mock-analysis textarea { width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; resize: vertical; font-family: inherit; }

 .day-feedback{border-radius:16px; background:var(--surface-soft); padding:16px 18px; margin-top:6px;}
 .day-feedback h3{margin:0 0 4px; font-size:15px;}
 .day-feedback .sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
 .day-feedback textarea{width:100%; min-height:74px; border-radius:12px; border:1px solid var(--line); padding:10px 12px; font-family:'Noto Sans KR',sans-serif; font-size:13px; resize:vertical;}
 .feedback-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
 .feedback-actions button{
 border:none; border-radius:20px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer;
 background:var(--ink); color:#fff;
 }
 .feedback-actions button.secondary{background:#fff; color:var(--ink); border:1px solid var(--line);}
 .save-flag{font-size:10.5px; color:var(--lime); opacity:0; transition:opacity .3s;}
 .save-flag.show{opacity:1;}
 .save-badge{font-size:11px; padding:4px 11px; border-radius:20px; font-weight:600; background:var(--surface-soft); color:var(--ink-soft); white-space:nowrap;}
 .save-badge.ok{background:var(--lime-soft); color:var(--lime);}
 .save-badge.saving{background:var(--coral-soft); color:var(--coral);}
 .save-badge.err{background:var(--blue-soft); color:var(--blue); cursor:pointer;}
 .t-elapsed.danger{color:var(--purple); animation:pulse 1s infinite;}
 @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.45;}}
 .t-elapsed.done{color:var(--lime);}

 section.viz{background:var(--surface); border-radius:24px; box-shadow:var(--shadow); padding:26px 28px 22px; margin-bottom:30px;}
 .viz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px;}
 .viz-grid .chart-group:nth-child(1) { order: 1; } 
 .viz-grid .chart-group:nth-child(2) { order: 3; } 
 .viz-grid .chart-group:nth-child(3) { order: 2; } 
 .viz-grid .chart-group:nth-child(4) { order: 4; } 

 @media (max-width: 900px) {
 .viz-grid { grid-template-columns: 1fr; }
 .viz-grid .chart-group { order: 0 !important; }
}
 .chart-group{background:var(--surface); border-radius:16px; padding:16px 18px; border:1px solid var(--line); margin-bottom:0;}
 .chart-group.small-padding{padding:12px 14px;} 
 .chart-group-title{font-weight:700; font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
 .chart-group-title .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
 .chart-item{display:flex; align-items:center; gap:12px; margin-bottom:6px; font-size:12.5px;}
 .chart-item .name{width:120px; flex-shrink:0; font-weight:500; color:var(--ink);}
 .chart-item .bar-wrap{flex:1; height:18px; background:var(--surface-soft); border-radius:10px; overflow:hidden; position:relative;}
 .chart-item .bar-fill{height:100%; border-radius:10px; transition:width 0.5s ease;}
 .chart-item .bar-over{height:100%; border-radius:0 10px 10px 0; background:var(--gold); transition:width 0.5s ease;}
 .chart-item .label{width:70px; flex-shrink:0; text-align:right; font-size:11.5px; color:var(--ink-soft); font-weight:600;}
 .chart-item .label .achieved{color:var(--ink); font-weight:700;}
 .chart-item .label .goal{color:var(--ink-soft);}
 .chart-item .label .over{color:var(--gold); font-weight:700;}

 .modal-overlay{position:fixed; inset:0; background:rgba(26,32,44,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; animation:fadeIn .2s ease;}
 @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
 .modal-box{background:var(--surface); border-radius:22px; max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:26px 28px; box-shadow:0 30px 60px -20px rgba(26,32,44,.4);}
 .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
 .modal-head h3{margin:0; font-size:19px;}
 .modal-head .modal-pct{font-size:13px; font-weight:800;}
 .modal-sub{font-size:12px; color:var(--ink-soft); margin-bottom:16px;}
 .modal-close{border:none; background:var(--surface-soft); color:var(--ink-soft); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1;}
 .memo-item{border-left:3px solid var(--line); padding:8px 0 8px 14px; margin-bottom:10px;}
 .memo-item .memo-day{font-size:11.5px; font-weight:700; color:var(--ink);}
 .memo-item .memo-content{font-size:11px; color:var(--ink-soft); margin-bottom:3px;}
 .memo-item .memo-text{font-size:13px; color:var(--ink); line-height:1.5; white-space:pre-wrap;}
 .modal-empty{font-size:13px; color:var(--ink-soft); text-align:center; padding:30px 0;}

 .mock-box{background:var(--purple-soft); border-radius:16px; padding:16px 20px; margin-bottom:22px;}
 .mock-box h3{margin:0 0 10px; font-size:14.5px; color:var(--purple);}
 .mock-round-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px;}
 .mock-round-card{background:#fff; border-radius:12px; padding:11px 13px; border:1px solid var(--line);}
 .mock-round-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; color:var(--purple); margin-bottom:6px;}
 .mock-round-head .mock-code{font-size:10.5px; color:var(--ink-soft); font-weight:600;}
 .mock-round-body{font-size:11.5px; color:var(--ink); line-height:1.75;}
 .mock-round-body i{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px;}

 .info-modal-box {max-width: 1120px; width: 100%; background: var(--surface); border-radius: 24px; padding: 28px 30px; max-height: 86vh; overflow-y: auto; box-shadow: 0 30px 70px -20px rgba(26, 32, 44, 0.4);}
 .info-tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 20px; padding-bottom: 2px; overflow-x: auto;}
 .info-tab-btn { background: none; border: none; padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; position: relative;}
 .info-tab-btn.active { color: var(--blue); font-weight: 700;}
 .info-tab-btn.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 3px; background: var(--blue); border-radius: 2px;}
 .info-tab-content { display: none;}
 .info-tab-content.active { display: block; animation: fadeIn 0.25s ease;}
 .info-table { width: 100%; table-layout: auto; border-collapse: collapse; margin-bottom: 22px; font-size: 12.5px; text-align: left; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);}
 .info-table th { background: var(--surface-soft); color: var(--ink); font-weight: 700; padding: 12px 16px; border-bottom: 2px solid var(--line); white-space: nowrap; }
 .info-table td { padding: 12px 16px; border-bottom: 1px solid #f1f3f5; color: var(--ink); line-height: 1.6; vertical-align: middle; word-break: break-word; white-space: normal; }
 .info-table tr:last-child td { border-bottom: none;}
 .info-sec-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px; color: var(--ink); display: flex; align-items: center; gap: 6px;}

 .photo-fb-banner{font-size:11.5px; padding:10px 14px; border-radius:12px; margin-bottom:14px; line-height:1.5;}
 .photo-fb-banner.ok{background:var(--lime-soft); color:var(--lime);}
 .photo-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin-bottom: 24px; box-shadow: var(--shadow); }
 .photo-group-title { font-weight: 700; font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--ink); }
 .photo-group-title .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
 .photo-grid { display: flex; flex-wrap: wrap; gap: 24px; }
 .photo-card { flex: 0 0 230px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
 .photo-card .photo-slot { width: 100%; flex: none; min-width: 0; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: var(--surface-soft); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
 .photo-card .photo-slot iframe { width: 100%; height: 100%; border: none; display: block; object-fit: cover; }
 .photo-card .photo-name { font-size: 14px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.3; }
 .photo-card .photo-desc { font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.4; }
 .common-guide { background: var(--purple-soft); border: 1.5px solid var(--purple); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
 .common-guide .photo-grid { gap: 20px; }
 .common-guide .photo-card { flex: 0 0 200px; }

 .visual-timer-overlay{position:fixed; inset:0; background:rgba(26,32,44,.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; animation:fadeIn .2s ease;}
 .visual-timer-box{background:#fff; border-radius:32px; max-width:560px; width:100%; padding:32px 28px 28px; text-align:center; box-shadow:0 30px 70px -20px rgba(26,32,44,.45);}
 .visual-timer-box h3{margin:0; font-size:18px; font-weight:700;}
 .visual-timer-box .vt-sub{font-size:12px; color:var(--ink-soft); margin:4px 0 0;}
 .visual-timer-body{display:flex; align-items:center; gap:24px; margin-top:12px; text-align:left;}
 .timer-steps{flex:1; min-width:0; align-self:stretch; display:flex; flex-direction:column;}
 .timer-steps-label{font-size:11.5px; font-weight:700; color:var(--ink-soft); letter-spacing:.04em; margin-bottom:6px;}
 .timer-steps textarea{
 flex:1; width:100%; min-height:200px; resize:vertical; box-sizing:border-box;
 border:1px solid var(--line); border-radius:14px; padding:12px 13px;
 font-family:inherit; font-size:12.5px; line-height:1.7; color:var(--ink);
 background:var(--surface-soft); outline:none;
 }
 .timer-steps textarea:focus{box-shadow:0 0 0 2px var(--blue-soft); border-color:var(--blue);}
 .timer-clock-col{flex:none; display:flex; flex-direction:column; align-items:center;}
 .visual-clock{width:200px; height:200px; margin:0 auto; border-radius:50%; position:relative; background:#f0f4f8; box-shadow:inset 0 0 0 2px var(--line);}
 .visual-clock-face{position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--blue) 0% 100%, #e2e8f0 100% 100%); transition:background 0.2s;}
 .visual-clock-knob{position:absolute; top:50%; left:50%; width:14px; height:14px; background:#fff; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 2px 8px rgba(0,0,0,0.15), 0 0 0 3px var(--blue);}
 .visual-time-text{font-weight:800; font-size:36px; margin-top:16px; color:var(--ink); letter-spacing:0.02em;}
 .visual-time-text.over{color:var(--coral);}
 .visual-timer-actions{display:flex; gap:10px; justify-content:center; margin-top:20px;}
 .visual-timer-actions button{border:none; padding:9px 22px; font-size:13px; font-weight:700; border-radius:30px; cursor:pointer; background:var(--ink); color:#fff; transition:background .15s;}
 .visual-timer-actions button.gold{background:var(--coral);}
 .visual-timer-actions button.ghost{background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--line);}

 .top-actions{display:flex; justify-content:flex-end; align-items:center; gap:10px; margin:-8px 0 26px;}
 .reset-btn{background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:11.5px; padding:6px 12px; border-radius:20px; cursor:pointer;}
 .loading{text-align:center; padding:80px 0; color:var(--ink-soft); font-size:13px;}
 
 .prep-modal .prep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin: 12px 0; }
 .prep-modal label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
 .prep-modal input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--blue); }

 /* Responsive */
 @media (max-width: 900px) {
  #statsContainer { grid-template-columns: 1fr !important; }
  #statsContainer > div:nth-child(3) { grid-column: 1 / 2 !important; }
 }
 @media (max-width: 600px) {
 .wrap {padding: 16px 12px; }
 header.top { flex-direction: column; align-items: stretch; gap: 16px; }
 header.top h1 { font-size: 24px; }

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsGQvm8pzUZo2AcM9fU5LLMLtjULrQMLWjOVHhdDcWH5NMGvbVOVeFmNK2BqOqB1cjHA/exec";

window.storage = {
 get: async (key, defaultValue) => {
 try {
 const res = await fetch(`${GOOGLE_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
 const data = await res.json();
 if (data && data.value) {
 return { value: data.value };
 }
 } catch (e) {
 console.warn('구글 시트 읽기 실패, localStorage 폴백', e);
 }
 const val = localStorage.getItem(key);
 return { value: val || defaultValue };
 },
 set: async (key, value) => {
 try {
 await fetch(GOOGLE_SCRIPT_URL, {
 method: 'POST',
 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
 body: JSON.stringify({ action: "set", key: key, value: value })
 });
 return true;
 } catch (e) {
 console.warn('구글 시트 저장 서버 통신 중, localStorage 동시 기록', e);
 }
 localStorage.setItem(key, value);
 return true;
 }
};

async function loadStateFromServer() {

 Object.keys(parsed.days || {}).forEach(k => {

function scheduleRetry(){

 const delay = Math.min(20000, 1500 * Math.pow(1.7, saveRetryCount));
 saveRetryTimeout = setTimeout(doSave, delay);
}

function dayPercent(day){
 const st = ensureDay(day);
 let total=0, done=0;
 st.reps.forEach(arr=>{ total+=arr.length; done+=arr.filter(Boolean).length; });
 return total? Math.round(done/total*100) : 0;
}
function overallPercent(){
 let total=0, done=0;
 PLAN.forEach(d=>{
 const st = ensureDay(d.day);
 st.reps.forEach(arr=>{ total+=arr.length; done+=arr.filter(Boolean).length; });
 });
 return total? Math.round(done/total*100):0;
}
function subjectOverall(idx){
 let total=0, done=0;
 PLAN.forEach(d=>{
 const st = ensureDay(d.day);
 const arr = st.reps[idx] || [];
 total += arr.length; done += arr.filter(Boolean).length;
 });
 return total? Math.round(done/total*100):0;
}
function perRepMinutes(day, idx){ return WEEK_MIN[weekOf(day)][idx]; }
function perRepSeconds(day, idx){ return perRepMinutes(day, idx) * 60; }

const BASE_TIME = {
 subject1_full: 1.50, subject1_half: 0.75,
 subject2_full: 1.33, subject2_half: 0.67,
 subject3: 0.92, subject4: 0.42
};

function calculateDayTotal(dayPlan) {
 const subjects = dayPlan.subjects;
 let total = 0;
 const details = [];

 if (subjects[0]) {
 const s = subjects[0];
 let time = 0;
 const name = s.name;
 if (name.includes('풀')) {
 const count = (name.match(/풀/g) || []).length;
 time = count * BASE_TIME.subject1_full;
 } else if (name.includes('축소') || name.includes('단일')) {
 const match = name.match(/[\d.]+/);
 const count = match ? parseFloat(match[0]) : 1;
 time = count * BASE_TIME.subject1_half;
 }
 if (s.count === 0) time = 0;
 total += time;
 details.push({ subject: '1과목', name: s.name, time: time });
 }

 if (subjects[1]) {
 const s = subjects[1];
 let time = 0;
 const name = s.name;
 if (name.includes('합본')) {
 const match = name.match(/[\d.]+/);
 const count = match ? parseFloat(match[0]) : 1;
 time = count * BASE_TIME.subject2_full;
 } else if (name.includes('단일')) {
 const match = name.match(/[\d.]+/);
 const count = match ? parseFloat(match[0]) : 1;
 time = count * BASE_TIME.subject2_half;
 }
 if (s.count === 0) time = 0;
 total += time;
 details.push({ subject: '2과목', name: s.name, time: time });
 }

 if (subjects[2]) {
 const s = subjects[2];
 let time = 0;
 if (s.name !== '연장 없음' && s.count > 0) time = s.count * BASE_TIME.subject3;
 total += time;
 details.push({ subject: '3과목', name: s.name, time: time });
 }

 if (subjects[3]) {
 const s = subjects[3];
 let time = 0;
 if (s.name !== '제거 없음' && s.count > 0) time = s.count * BASE_TIME.subject4;
 total += time;
 details.push({ subject: '4과목', name: s.name, time: time });
 }

 return { total: Math.round(total * 100) / 100, details: details };
}

function estimatedDayMinutes(day){
 const d = PLAN[day-1];
 return Math.round(calculateDayTotal(d).total * 60);
}
function formatMinutes(mins){
 const h = Math.floor(mins/60), m = mins%60;
 if(h === 0) return `${m}분`;
 if(m === 0) return `${h}시간`;
 return `${h}시간 ${m}분`;
}
function getRemaining(day, idx){
 const st = ensureDay(day);
 const r = st.timerRemaining[idx];
 return (r===null || r===undefined) ? perRepSeconds(day, idx) : r;
}
function fmtTime(sec){
 sec = Math.max(0, Math.round(sec));
 const m = Math.floor(sec/60), s = sec%60;
 return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function fmtOverTime(sec){
 if(sec <= 0) return '00:00';
 const m = Math.floor(sec/60), s = Math.round(sec%60);
 return '+' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ============ 7. 종목별 집계 함수 ============ */
function aggregateCounts(){
 const counts = {};
 Object.keys(GOAL_COUNTS).forEach(k => counts[k] = 0);

 PLAN.forEach(d => {
 const st = ensureDay(d.day);
 d.subjects.forEach((subj, idx) => {
 const doneCount = st.reps[idx].filter(Boolean).length;
 if(doneCount === 0) return;
 const name = subj.name;

 if(d.mock && MOCK_ROUNDS.some(r => r.date === d.date)) {
 const rounds = MOCK_ROUNDS.filter(r => r.date === d.date);
 const repeatCount = subj.count > 0 ? subj.count : 1;
 rounds.forEach(round => {
 const subNames = [round.sub1, round.sub2, round.sub3, round.sub4];
 for(let i=0; i<repeatCount; i++){
 if(idx===0){
 if(subNames[0] && counts[subNames[0]]!==undefined) counts[subNames[0]]+=doneCount;
 counts['레드풀컬러']+=doneCount;
 } else if(subNames[idx] && counts[subNames[idx]]!==undefined) {
 counts[subNames[idx]]+=doneCount;
 }
 }
 });
 return;
 }

 if(name.includes('+') || name.includes('x')) {
 const base = name.split('x')[0].trim();
 if(base.includes('+')) {
 base.split('+').forEach(p => {
 const trimmed = p.trim();
 let mKey = Object.keys(GOAL_COUNTS).find(k => k === trimmed) || Object.keys(GOAL_COUNTS).find(k => trimmed.includes(k) || k.includes(trimmed));
 if(mKey) {
 const multi = parseInt(name.split('x')[1]) || 1;
 counts[mKey] += doneCount * multi;
 if(idx===0 && mKey!=='레드풀컬러') counts['레드풀컬러']+=doneCount*multi;
 }
 });
 } else {
 let mKey = Object.keys(GOAL_COUNTS).find(k => k === base) || Object.keys(GOAL_COUNTS).find(k => base.includes(k) || k.includes(base));
 if(mKey) {
 const multi = parseInt(name.split('x')[1]) || 1;
 counts[mKey] += doneCount * multi;
 if(idx===0 && mKey!=='레드풀컬러') counts['레드풀컬러']+=doneCount*multi;
 }
 }
 return;
 }

 let mKey = Object.keys(GOAL_COUNTS).find(k => k === name) || Object.keys(GOAL_COUNTS).find(k => name.includes(k) || k.includes(name));
 if(mKey){
 counts[mKey] += doneCount;
 if(idx===0 && mKey!=='레드풀컬러') counts['레드풀컬러']+=doneCount;
 }
 });
 });
 return counts;
}

function ringSVG(pct, size, color, strokeW){
 const r = (size-strokeW)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="${strokeW}" fill="none"/>
 <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${strokeW}" fill="none"
 stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
 </svg>`;
}

function renderItemChart(){
 const el = document.getElementById('itemChart');
 if(!el) return;

 const groupColors = { '1과목': 'var(--blue)', '2과목': 'var(--coral)', '3과목': 'var(--purple)', '4과목': 'var(--lime)' };
 
 let html = '<div class="viz-grid">';
 Object.keys(groups).forEach((label) => {
 const items = groups[label];
 const smallClass = (label === '2과목' || label === '4과목') ? ' small-padding' : '';
 html += `<div class="chart-group${smallClass}">`;
 html += `<div class="chart-group-title"><span class="dot" style="background:${groupColors[label]}"></span>${label}</div>`;
 items.forEach(itemName => {
 const achieved = counts[itemName] || 0;
 const goal = GOAL_COUNTS[itemName] || 1;
 const pct = Math.min(100, Math.round((achieved / goal) * 100));
 const over = achieved > goal ? achieved - goal : 0;
 html += `<div class="chart-item"><span class="name">${itemName}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.min(100, pct)}%; background:${groupColors[label]};"></div>`;
 if(over > 0) html += `<div class="bar-over" style="width:${Math.min(100, (over/goal)*100)}%;"></div>`;
 html += `</div><div class="label"><span class="achieved">${achieved}</span> / <span class="goal">${goal}</span>${over>0 ? ` <span class="over">(+${over})</span>` : ''}</div></div>`;
 });
 html += `</div>`;
 });
 html += `</div>`;
 el.innerHTML = html;
}

function saveEvaluation(subjKey) {
 const criteria = EVAL_CRITERIA[subjKey];
 let score = 0;
 let weaknesses = [];
 const pointPerItem = 100 / criteria.length;

 criteria.forEach((c, idx) => {
 if(document.getElementById(`chkEval_${idx}`).checked) { score += pointPerItem; } 
 else { 
 weaknesses.push(c.replace(/\[.*?\]\s*/, '')); 
 }
 });

 if(!state.evaluations) state.evaluations = {};
 if(!state.evaluations[subjKey]) state.evaluations[subjKey] = [];

 state.evaluations[subjKey].push({
 date: new Date().toLocaleDateString(),
 timestamp: Date.now(),
 score: Math.round(score),
 weaknesses: weaknesses
 });

 saveState();
 updateStatsDashboard();
 alert(`평가가 완료되었습니다. (점수: ${Math.round(score)}점)`);
 document.getElementById('checklistContainer').style.display = 'none';
}

 let subjTotal = 0;
 evals.forEach(e => {
 subjTotal += e.score; totalScore += e.score; evalCount++;
 allScores.push({ subj: SUBJECT_NAMES[subjKey], ...e });

/* ============ 10. 타이머 관련 함수 ============ */
function playBeepAlert(){
 try{
 const AudioCtx = window.AudioContext || window.webkitAudioContext;
 if(!AudioCtx) return;
 const ctx = new AudioCtx();
 const count = 5, duration = 1.5, interval = 0.8, frequency = 880, volume = 0.8;
 for(let i = 0; i < count; i++){
 const delay = i * (duration + interval);
 const osc = ctx.createOscillator(), gain = ctx.createGain();
 osc.connect(gain); gain.connect(ctx.destination);
 osc.frequency.setValueAtTime(frequency, ctx.currentTime + delay);
 gain.gain.setValueAtTime(0.001, ctx.currentTime + delay);
 gain.gain.exponentialRampToValueAtTime(volume, ctx.currentTime + delay + 0.05);
 gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
 osc.start(ctx.currentTime + delay); osc.stop(ctx.currentTime + delay + duration);
 }
 }catch(e){}
}

function startTimer(day, idx){
 stopRunningTimer(true);
 let remaining = getRemaining(day, idx);
 if(remaining<=0) remaining = perRepSeconds(day, idx);
 runningTimer = { day, idx, startedAt: Date.now(), duration: remaining, totalTarget: perRepSeconds(day, idx), name: PLAN[day-1].subjects[idx].name, status: 'running' };
 renderTaskGrid(day); openVisualTimer(); clearInterval(tickInterval);
 tickInterval = setInterval(()=>{
 if(!runningTimer) return;
 if(runningTimer.status === 'finished'){
 const overSec = (Date.now() - runningTimer.finishedAt) / 1000;
 const el = document.getElementById('elapsed-'+idx);
 if(el) el.textContent = fmtOverTime(overSec);
 updateVisualTimerUI(0, overSec);
 return;
 }
 const left = runningTimer.duration - (Date.now()-runningTimer.startedAt)/1000;
 const el = document.getElementById('elapsed-'+idx);
 if(left <= 0){
 runningTimer.status = 'finished'; runningTimer.finishedAt = Date.now();
 const st = ensureDay(day); st.timerRemaining[idx] = 0; saveState(); playBeepAlert(); openVisualTimer(); renderTaskGrid(day); return;
 }
 if(el){ el.textContent = fmtTime(left); el.classList.toggle('danger', left<=10); }
 updateVisualTimerUI(left);
 }, 250);
}

function pauseTimer(day, idx){
 if(runningTimer && runningTimer.day===day && runningTimer.idx===idx && runningTimer.status === 'running'){
 const st = ensureDay(day);
 st.timerRemaining[idx] = Math.max(0, runningTimer.duration - (Date.now()-runningTimer.startedAt)/1000);
 runningTimer = null; clearInterval(tickInterval); saveState(); renderTaskGrid(day); closeVisualTimer();
 }
}

function stopRunningTimer(save){
 if(runningTimer){
 const {day, idx, status} = runningTimer;
 const st = ensureDay(day);
 if(status === 'running') st.timerRemaining[idx] = Math.max(0, runningTimer.duration - (Date.now()-runningTimer.startedAt)/1000);
 else st.timerRemaining[idx] = null;
 runningTimer = null; clearInterval(tickInterval); if(save) saveState(); closeVisualTimer();
 }
}

function resetTimer(day, idx){
 if(runningTimer && runningTimer.day===day && runningTimer.idx===idx){
 runningTimer = null; clearInterval(tickInterval); closeVisualTimer();
 }
 ensureDay(day).timerRemaining[idx] = null; saveState(); renderTaskGrid(day);

function getDriveImageUrl(input) {
 if (!input) return null;
 let fileId = String(input).trim();
 if (!fileId || fileId.includes("구글_")) return null;

 const match = fileId.match(/\/d\/([a-zA-Z0-9_-]+)/);
 if (match) fileId = match[1];

 if (!/^[a-zA-Z0-9_-]{15,}$/.test(fileId)) return null;

 return `https://drive.google.com/file/d/${fileId}/preview`;
}

function openPrepModal(){
 const modalRoot = document.getElementById('modalRoot');
 const prep = state.prepChecklist || {};
 modalRoot.innerHTML = `
 <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
 <div class="modal-box prep-modal">
 <div class="modal-head"><h3>📦 시험 준비물 체크리스트</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
 <div class="modal-sub">시험장에 가기 전 모든 준비물이 갖춰졌는지 확인하세요.</div>
 <div class="prep-grid">
 <label><input type="checkbox" ${prep.nipper?'checked':''} onchange="updatePrep('nipper',this.checked)"> 니퍼</label>
 <label><input type="checkbox" ${prep.file?'checked':''} onchange="updatePrep('file',this.checked)"> 파일/버퍼</label>
 <label><input type="checkbox" ${prep.glue?'checked':''} onchange="updatePrep('glue',this.checked)"> 글루</label>
 <label><input type="checkbox" ${prep.brush?'checked':''} onchange="updatePrep('brush',this.checked)"> 브러쉬</label>
 <label><input type="checkbox" ${prep.lamp?'checked':''} onchange="updatePrep('lamp',this.checked)"> UV/LED 램프</label>
 <label><input type="checkbox" ${prep.tip?'checked':''} onchange="updatePrep('tip',this.checked)"> 팁</label>
 <label><input type="checkbox" ${prep.gel?'checked':''} onchange="updatePrep('gel',this.checked)"> 젤</label>
 <label><input type="checkbox" ${prep.acrylic?'checked':''} onchange="updatePrep('acrylic',this.checked)"> 아크릴 파우더</label>
 <label><input type="checkbox" ${prep.silk?'checked':''} onchange="updatePrep('silk',this.checked)"> 실크</label>
 <label><input type="checkbox" ${prep.remover?'checked':''} onchange="updatePrep('remover',this.checked)"> 리무버</label>
 <label><input type="checkbox" ${prep.sanitizer?'checked':''} onchange="updatePrep('sanitizer',this.checked)"> 손 소독제</label>
 <label><input type="checkbox" ${prep.towel?'checked':''} onchange="updatePrep('towel',this.checked)"> 타올/페이퍼</label>
 <label><input type="checkbox" ${prep.dustCollector?'checked':''} onchange="updatePrep('dustCollector',this.checked)"> 흡진기</label>
 </div>
 <div class="feedback-actions" style="margin-top:14px;"><button onclick="closeModal()">닫기</button></div>
 </div></div>`;
}
function updatePrep(key, val){ state.prepChecklist[key] = val; saveState(); }

function escapeHtml(str){ return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

(async function init(){
 state = defaultState();
 const today = new Date(), todayStr = `${today.getMonth()+1}/${today.getDate()}`; 
 const matchedDay = PLAN.find(d => d.date.startsWith(todayStr));
 if(matchedDay) selectedDay = matchedDay.day;

 renderApp();
 setSaveStatus('ok');
 await loadStateFromServer();
 const loading = document.getElementById('loadingMsg');
 if (loading) loading.style.display = 'none';
 
 const examDate = new Date(2026, 7, 5); 
 const diff = Math.ceil((examDate - today) / (1000*60*60*24));
 if(diff <= 3 && diff >= 0) {
 setTimeout(() => { if(confirm('📢 시험 3일 전입니다! 준비물 체크리스트를 확인하시겠어요?')) openPrepModal(); }, 800);
 }
 document.getElementById('dayPanel').scrollIntoView({behavior:'smooth', block:'start'});
})();

window.addEventListener('beforeunload', ()=>stopRunningTimer(true));
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeModal(); closeVisualTimer(); } });
</script>
